services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/var/local/frontend:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    # On Linux, host.docker.internal must be mapped to the host gateway so the
    # /api/ proxy can reach the backend bound on 127.0.0.1:3002.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # Reload nginx every 6h so renewed certs are picked up without downtime.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $$!; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Check twice a day; certbot only renews certs within 30 days of expiry.
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"
    restart: unless-stopped

volumes:
  certbot-conf:
  certbot-www:
