[package]
name = "photobomb-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-multipart = "0.7.2"
actix-web = "4.10.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["fs"] }
uuid = { version = "1.16.0", features = ["v4"] }
mime = "0.3.17"
sanitize-filename = "0.6.0"
image = "0.25.6"
log = "0.4.27"
env_logger = "0.11.8"
