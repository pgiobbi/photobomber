services:
  photobomb-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUST_VERSION: 1.86.0
        APP_NAME: photobomb-backend
    # Run as the host user that owns ./config and ./uploads (uid 1000) so the
    # container can create photobomb.sqlite and write uploads in the mounts.
    user: "1000:1000"
    volumes:
      - ./uploads:/var/local/uploads
      - ./config:/var/local/config
    # Bind to the docker bridge IP (not 127.0.0.1) so the nginx container can
    # reach it via host.docker.internal:3002. 172.17.0.1 is the docker0 gateway,
    # which is not externally routable, so the backend stays private.
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - RUST_LOG=debug
      - UPLOAD_DIR=/var/local/uploads
      - CONFIG_DIR=/var/local/config
      - FPX_JWT_SECRET=${FPX_JWT_SECRET:-your-jwt-secret-here}
      - FPX_ACCESS_TOKEN_DURATION_MINUTES=1440
      - FPX_REFRESH_TOKEN_DURATION_MINUTES=10080
      - PHOTOBOMBER_CORS_ALLOW_ALL=false
      - PHOTOBOMBER_ADMIN_USERNAME=${PHOTOBOMBER_ADMIN_USERNAME:-username-change-me}
      - PHOTOBOMBER_ADMIN_PASSWORD=${PHOTOBOMBER_ADMIN_PASSWORD:-password-change-me}
    platform: linux/arm64
    restart: unless-stopped
