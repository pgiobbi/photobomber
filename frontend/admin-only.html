<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e1b2b">
    <meta name="description" content="Admin panel to update location at Tomorrowland 2025">
    <title>Admin - Update Location | Tomorrowland Photobomb</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="shortcut icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
    <meta name="apple-mobile-web-app-title" content="Photobomb Admin"/>
    <link rel="manifest" href="/manifest.json"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/impact" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: rgba(14, 27, 43, 0.1);
            background-image: linear-gradient(135deg, rgba(14, 27, 43, 0.85), rgba(25, 40, 65, 0.7)), url('/assets/orbyz-notext.webp');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            height: 100dvh;
        }

        .glow {
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7),
            0 0 12px rgba(65, 176, 232, 0.5),
            0 0 20px rgba(65, 176, 232, 0.4);
        }

        .title-glow {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9),
            0 0 20px rgba(65, 176, 232, 0.8),
            0 0 40px rgba(147, 51, 234, 0.6),
            0 0 60px rgba(239, 68, 68, 0.4);
            letter-spacing: 3px;
        }

        .gradient-animate {
            background: linear-gradient(60deg, #ff00ff, #d7ef00, #ff4444, #ff00ff);
            background-size: 200% 200%;
            animation: animatedGradient 8s ease-in-out infinite alternate, ctaPulse 1.5s ease-in-out infinite;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        @keyframes animatedGradient {
            0% {
                background-position: 70% 100%;
            }
            100% {
                background-position: 180% 50%;
            }
        }

        @keyframes ctaPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .festival-text {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1;
        }

        .halo {
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.15;
            z-index: -1;
        }

        input[type="text"], input[type="password"] {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #41B0E8;
            box-shadow: 0 0 8px rgba(65, 176, 232, 0.5);
        }

        /* Highlight style for custom location input */
        input[type="text"].active {
            background-color: rgba(255, 215, 0, 0.3);
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* Password toggle */
        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #41B0E8;
        }

        /* Stage card styles */
        .stage-card {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .stage-card:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .stage-card.active {
            background-color: rgba(255, 215, 0, 0.3); /* Yellow background */
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 30px rgba(255, 215, 0, 0.5);
        }

        /* Parameter item styles */
        .param-item {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            transition: all 0.2s ease;
        }

        .param-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .param-item.editing {
            background-color: rgba(255, 215, 0, 0.1);
            border-color: #FFD700;
        }

        .param-key {
            font-family: monospace;
            font-weight: bold;
            color: #41B0E8;
        }

        .param-value {
            font-family: monospace;
            color: #FFD700;
        }

        .param-updated {
            color: #9CA3AF;
            font-size: 0.75rem;
        }

        /* Modal styles */
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-content {
            background-color: rgba(31, 41, 55, 0.95);
            padding: 1.5rem;
            border-radius: 0.75rem;
            max-width: 20rem;
            width: 100%;
            margin: 1rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="flex min-h-dvh h-dvh flex-col items-center justify-between text-white">
<!-- Decorative elements -->
<div class="halo bg-blue-400 w-64 h-64 top-0 left-0"></div>
<div class="halo bg-purple-500 w-48 h-48 bottom-0 right-0"></div>

<!-- Main flex container -->
<div class="flex flex-col min-h-dvh w-full">
    <!-- Login Screen (hidden by default) -->
    <div id="loginScreen" class="flex-grow flex items-center justify-center p-4 sm:p-5 hidden">
        <div class="space-y-6 max-w-md w-full">
            <div class="text-center">
                <h1 class="text-3xl sm:text-4xl font-bold festival-text title-glow">
                    ADMIN LOGIN
                </h1>
                <div class="h-2 w-48 mx-auto bg-gradient-to-r from-pink-500 via-blue-500 to-purple-500 rounded-full mt-2 mb-4"></div>
                <p class="text-lg sm:text-xl festival-text glow">
                    Authenticate to update your location 📍
                </p>
            </div>

            <div>
                <label for="username" class="block text-sm sm:text-base font-semibold mb-2 glow">
                    Username
                </label>
                <input type="text" id="username" placeholder="Enter username" class="backdrop-blur-sm">
            </div>

            <div>
                <label for="password" class="block text-sm sm:text-base font-semibold mb-2 glow">
                    Password
                </label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter password" class="backdrop-blur-sm">
                    <span id="togglePassword" class="toggle-password">👁️</span>
                </div>
            </div>

            <button id="loginBtn"
                    class="w-full gradient-animate text-white font-bold py-3 sm:py-4 rounded-xl text-xl sm:text-2xl transition shadow-lg cta-pulse">
                Login 🔑
            </button>
        </div>
    </div>

    <!-- Main Content (hidden by default) -->
    <div id="mainContent" class="flex flex-col min-h-dvh w-full hidden">
        <!-- Header -->
        <header class="pt-4 px-4 sm:px-5 flex-shrink-0">
            <div class="text-center">
                <h1 class="text-3xl sm:text-4xl font-bold festival-text title-glow">
                    UPDATE LOCATION
                </h1>
                <div class="h-2 w-48 mx-auto bg-gradient-to-r from-pink-500 via-blue-500 to-purple-500 rounded-full mt-2 mb-2"></div>
                <p class="text-lg sm:text-xl festival-text glow">
                    Where are you? 📍
                </p>
                <p class="text-sm sm:text-base mt-2 glow">
                    Last Updated: <span id="lastUpdated">Not set</span>
                </p>
            </div>
        </header>

        <!-- Main content -->
        <main class="flex-grow p-4 sm:p-5 flex-shrink overflow-y-auto">
            <div class="max-w-2xl mx-auto space-y-4">
                <!-- Custom Location Input -->
                <div>
                    <label for="customLocation" class="block text-sm sm:text-base font-semibold mb-2 glow">
                        Custom Location
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="customLocation" placeholder="Enter custom location"
                               class="backdrop-blur-sm">
                        <button id="submitCustomLocation"
                                class="gradient-animate text-white font-bold py-3 px-6 rounded-lg transition" disabled>
                            Set
                        </button>
                    </div>
                </div>

                <!-- Stage Cards Container -->
                <div id="stageCards" class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- Dynamically populated stage cards -->
                    <!-- Reset Location Card -->
                    <div class="stage-card" data-location-type="reset">
                        <p class="text-sm sm:text-base font-semibold glow">No Location</p>
                    </div>
                </div>

                <!-- Parameters Management Section -->
                <div class="mt-8">
                    <h2 class="text-xl sm:text-2xl font-bold festival-text glow mb-4 text-center">
                        System Parameters 🔧
                    </h2>

                    <!-- Add New Parameter -->
                    <div class="bg-black/20 p-4 rounded-lg border border-white/20 mb-4">
                        <h3 class="text-lg font-semibold glow mb-3">Add/Update Parameter</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                            <div>
                                <label for="paramKey" class="block text-sm font-semibold mb-1 glow">
                                    Key
                                </label>
                                <input type="text" id="paramKey" placeholder="parameter_key" class="backdrop-blur-sm">
                            </div>
                            <div>
                                <label for="paramValue" class="block text-sm font-semibold mb-1 glow">
                                    Value
                                </label>
                                <input type="text" id="paramValue" placeholder="parameter_value"
                                       class="backdrop-blur-sm">
                            </div>
                        </div>
                        <button id="submitParam"
                                class="gradient-animate text-white font-bold py-2 px-4 rounded-lg transition" disabled>
                            Save Parameter
                        </button>
                    </div>

                    <!-- Parameters List -->
                    <div class="bg-black/20 p-4 rounded-lg border border-white/20">
                        <h3 class="text-lg font-semibold glow mb-3">Current Parameters</h3>
                        <div id="paramsList" class="space-y-2">
                            <p class="text-center text-white/70">Loading parameters...</p>
                        </div>
                        <button id="refreshParams"
                                class="mt-3 bg-blue-500/40 hover:bg-blue-500/60 text-white py-2 px-4 rounded-lg transition">
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="w-full text-center mt-4">
                    <button id="logoutBtn"
                            class="bg-red-400/40 hover:bg-opacity-50 text-white py-3 px-6 rounded-lg transition">
                        Logout
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginScreen = document.getElementById('loginScreen');
        const mainContent = document.getElementById('mainContent');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const stageCardsContainer = document.getElementById('stageCards');
        const lastUpdatedSpan = document.getElementById('lastUpdated');
        const customLocationInput = document.getElementById('customLocation');
        const submitCustomLocationBtn = document.getElementById('submitCustomLocation');
        const paramKeyInput = document.getElementById('paramKey');
        const paramValueInput = document.getElementById('paramValue');
        const submitParamBtn = document.getElementById('submitParam');
        const paramsListContainer = document.getElementById('paramsList');
        const refreshParamsBtn = document.getElementById('refreshParams');

        let stages = []; // Store stages from /api/admin/stages
        let currentCustomLocation = ''; // Track current custom location
        let parameters = []; // Store current parameters

        // Check authentication status on page load
        async function checkAuth() {
            try {
                const response = await fetch('/api/admin/profile', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });

                const data = await response.json();
                if (response.ok && data.user_id === 1) {
                    // Authenticated, show main content and load stages and current location
                    mainContent.classList.remove('hidden');
                    await Promise.all([fetchStages(), fetchCurrentLocation(), fetchParameters()]);
                } else {
                    throw new Error('Not authenticated');
                }
            } catch (err) {
                console.error('Auth check failed:', err);
                showModal('Error', 'Failed to check authentication status. Please try again.');
                loginScreen.classList.remove('hidden');
            }
        }

        // Fetch available stages from /api/admin/stages
        async function fetchStages() {
            try {
                const response = await fetch('/api/admin/stages', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch stages');
                }

                stages = await response.json();
                renderStageCards();
            } catch (err) {
                console.error('Failed to fetch stages:', err);
                showModal('Error', 'Failed to load stages. You can still set a custom location or reset.');
            }
        }

        // Render stage cards dynamically
        function renderStageCards() {
            // Clear existing stage cards except the reset card
            stageCardsContainer.innerHTML = `
            <div class="stage-card" data-location-type="reset">
                <p class="text-sm sm:text-base font-semibold glow">No Location</p>
            </div>
        `;

            // Add stage cards
            stages.forEach(stage => {
                const card = document.createElement('div');
                card.className = 'stage-card';
                card.dataset.locationType = 'tomorrowland';
                card.dataset.stageId = stage.id;
                card.dataset.stageName = stage.name;
                card.innerHTML = `<p class="text-sm sm:text-base font-semibold glow">${stage.name}</p>`;
                stageCardsContainer.insertBefore(card, stageCardsContainer.lastElementChild);
            });

            // Re-attach event listeners to all cards
            attachCardListeners();
        }

        // Fetch and highlight current location, update timestamp
        async function fetchCurrentLocation() {
            try {
                const response = await fetch('/api/admin/location', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch current location');
                }

                const data = await response.json();
                const location = data.location;
                const updatedAgo = data.updatedAgo;

                // Highlight the correct card or input
                const stageCards = stageCardsContainer.querySelectorAll('.stage-card');
                stageCards.forEach(card => card.classList.remove('active'));
                customLocationInput.classList.remove('active');
                submitCustomLocationBtn.disabled = true;

                if (location) {
                    if (location.type === 'tomorrowland') {
                        stageCards.forEach(card => {
                            if (card.dataset.locationType === 'tomorrowland' && card.dataset.stageId === location.id) {
                                card.classList.add('active');
                            }
                        });
                        customLocationInput.value = '';
                        currentCustomLocation = '';
                    } else if (location.type === 'custom') {
                        customLocationInput.classList.add('active');
                        customLocationInput.value = location.name;
                        currentCustomLocation = location.name;
                    }
                } else {
                    stageCardsContainer.querySelector('[data-location-type="reset"]').classList.add('active');
                    customLocationInput.value = '';
                    currentCustomLocation = '';
                }

                if (updatedAgo !== null && updatedAgo !== undefined) {
                    lastUpdatedSpan.textContent = secondsToHumanReadable(Math.floor(updatedAgo / 1000));
                } else {
                    lastUpdatedSpan.textContent = 'Not set';
                }
            } catch (err) {
                console.error('Failed to fetch current location:', err);
                showModal('Error', 'Failed to load current location. You can still update your location.');
                lastUpdatedSpan.textContent = 'Failed to load';
            }
        }

        // Fetch parameters from /api/admin/params
        async function fetchParameters() {
            try {
                const response = await fetch('/api/admin/params', {
                    method: 'GET',
                    headers: {'Content-Type': 'application/json'}
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch parameters');
                }

                parameters = await response.json();
                renderParameters();
            } catch (err) {
                console.error('Failed to fetch parameters:', err);
                paramsListContainer.innerHTML = '<p class="text-center text-red-400">Failed to load parameters</p>';
            }
        }

        // Render parameters list
        function renderParameters() {
            if (parameters.length === 0) {
                paramsListContainer.innerHTML = '<p class="text-center text-white/70">No parameters found</p>';
                return;
            }

            paramsListContainer.innerHTML = parameters.map(param => `
            <div class="param-item" data-key="${param.key}">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex-1 min-w-0">
                        <div class="param-key text-sm">${param.key}</div>
                        <div class="param-value text-lg break-all">${param.value}</div>
                        <div class="param-updated mt-1">Updated: ${formatDateTime(param.updatedAt)}</div>
                    </div>
                    <div class="flex gap-2 ml-2">
                        <button class="edit-param bg-yellow-500/40 hover:bg-yellow-500/60 text-white px-2 py-1 rounded text-xs transition"
                                data-key="${param.key}" data-value="${param.value}">
                            Edit
                        </button>
                    </div>
                </div>
            </div>
        `).join('');

            // Attach edit listeners
            document.querySelectorAll('.edit-param').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.dataset.key;
                    const value = e.target.dataset.value;
                    paramKeyInput.value = key;
                    paramValueInput.value = value;
                    updateSubmitParamButton();

                    // Highlight the parameter being edited
                    document.querySelectorAll('.param-item').forEach(item => item.classList.remove('editing'));
                    document.querySelector(`[data-key="${key}"]`).classList.add('editing');

                    // Scroll to form
                    paramKeyInput.scrollIntoView({behavior: 'smooth', block: 'center'});
                    paramKeyInput.focus();
                });
            });
        }

        // Format datetime string
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        // Update parameter via POST /api/admin/params
        async function updateParameter() {
            const key = paramKeyInput.value.trim();
            const value = paramValueInput.value.trim();

            if (!key) {
                showModal('Error', 'Please enter a parameter key.');
                return;
            }

            try {
                submitParamBtn.textContent = 'Saving...';
                submitParamBtn.disabled = true;

                const response = await fetch('/api/admin/params', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key, value})
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to update parameter');
                }

                // Clear form
                paramKeyInput.value = '';
                paramValueInput.value = '';
                updateSubmitParamButton();

                // Remove editing highlight
                document.querySelectorAll('.param-item').forEach(item => item.classList.remove('editing'));

                // Refresh parameters
                await fetchParameters();

                showModal('Success!', 'Parameter updated successfully! 🎉');

            } catch (err) {
                console.error('Parameter update error:', err);
                showModal('Error', `Failed to update parameter: ${err.message}. Please try again.`);
            } finally {
                submitParamBtn.textContent = 'Save Parameter';
                submitParamBtn.disabled = false;
            }
        }

        // Update submit button state for parameters
        function updateSubmitParamButton() {
            const key = paramKeyInput.value.trim();
            submitParamBtn.disabled = !key;
        }

        // Convert seconds to human-readable format
        function secondsToHumanReadable(seconds) {
            if (seconds < 60) return `${seconds} seconds ago`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
            const days = Math.floor(hours / 24);
            return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        // Handle login
        async function login() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showModal('Missing Info', 'Please enter both username and password.');
                return;
            }

            try {
                loginBtn.textContent = 'Logging in...';
                loginBtn.disabled = true;

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Login failed');
                }

                // Successful login, show main content
                loginScreen.classList.add('hidden');
                mainContent.classList.remove('hidden');
                usernameInput.value = '';
                passwordInput.value = '';
                await Promise.all([fetchStages(), fetchCurrentLocation(), fetchParameters()]);

            } catch (err) {
                console.error('Login error:', err);
                showModal('Login Failed', `Failed to login: ${err.message}. Please try again.`);

            } finally {
                loginBtn.textContent = 'Login 🔑';
                loginBtn.disabled = false;
            }
        }

        // Handle logout
        async function logout() {
            try {
                logoutBtn.textContent = 'Logging out...';
                logoutBtn.disabled = true;

                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });

                // Show login screen
                loginScreen.classList.remove('hidden');
                mainContent.classList.add('hidden');
            } catch (err) {
                console.error('Logout error:', err);
                showModal('Logout Failed', `Failed to logout: ${err.message}. Please try again.`);
            } finally {
                logoutBtn.textContent = 'Logout';
                logoutBtn.disabled = false;
            }
        }

        // Toggle password visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Handle login/logout button click
        loginBtn.addEventListener('click', login);
        logoutBtn.addEventListener('click', logout);

        // Handle Enter key for login
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // Handle custom location submission
        submitCustomLocationBtn.addEventListener('click', async () => {
            const customName = customLocationInput.value.trim();
            if (!customName) {
                showModal('Error', 'Please enter a custom location name.');
                return;
            }

            try {
                submitCustomLocationBtn.textContent = 'Setting...';
                submitCustomLocationBtn.disabled = true;

                const response = await fetch('/api/admin/location', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        location: {
                            type: 'custom',
                            name: customName
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'Failed to update location');
                }

                // Update UI
                const stageCards = stageCardsContainer.querySelectorAll('.stage-card');
                stageCards.forEach(c => c.classList.remove('active'));
                customLocationInput.classList.add('active');
                currentCustomLocation = customName;
                lastUpdatedSpan.textContent = 'Just now';

                showModal('Success!', 'Location updated successfully! Your photobombers will be notified. 🎉');

            } catch (err) {
                console.error('Update error:', err);
                showModal('Error', `Failed to update location: ${err.message}. Please try again.`);
            } finally {
                submitCustomLocationBtn.textContent = 'Set';
                submitCustomLocationBtn.disabled = customName === currentCustomLocation;
            }
        });

        // Enable/disable Set button based on input change
        customLocationInput.addEventListener('input', () => {
            const customName = customLocationInput.value.trim();
            submitCustomLocationBtn.disabled = customName === currentCustomLocation || customName === '';
        });

        // Handle Enter key for custom location
        customLocationInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !submitCustomLocationBtn.disabled) {
                submitCustomLocationBtn.click();
            }
        });

        // Parameter form event listeners
        paramKeyInput.addEventListener('input', updateSubmitParamButton);
        paramValueInput.addEventListener('input', updateSubmitParamButton);

        submitParamBtn.addEventListener('click', updateParameter);

        // Handle Enter key for parameter form
        paramKeyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !submitParamBtn.disabled) {
                updateParameter();
            }
        });
        paramValueInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !submitParamBtn.disabled) {
                updateParameter();
            }
        });

        // Refresh parameters button
        refreshParamsBtn.addEventListener('click', async () => {
            const originalText = refreshParamsBtn.textContent;
            try {
                refreshParamsBtn.textContent = 'Refreshing...';
                refreshParamsBtn.disabled = true;
                await fetchParameters();
            } catch (err) {
                console.error('Failed to refresh parameters:', err);
            } finally {
                refreshParamsBtn.textContent = originalText;
                refreshParamsBtn.disabled = false;
            }
        });

        // Attach listeners to stage cards
        function attachCardListeners() {
            const stageCards = stageCardsContainer.querySelectorAll('.stage-card');
            stageCards.forEach(card => {
                card.addEventListener('click', async () => {
                    let requestBody;
                    const originalText = card.querySelector('p').textContent;

                    if (card.dataset.locationType === 'tomorrowland') {
                        requestBody = {
                            location: {
                                type: 'tomorrowland',
                                id: card.dataset.stageId,
                                name: card.dataset.stageName
                            }
                        };
                    } else if (card.dataset.locationType === 'reset') {
                        requestBody = {location: null};
                    } else {
                        return;
                    }

                    try {
                        card.querySelector('p').textContent = 'Updating...';

                        const response = await fetch('/api/admin/location', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify(requestBody)
                        });

                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.message || 'Failed to update location');
                        }

                        // Update highlight
                        const allStageCards = stageCardsContainer.querySelectorAll('.stage-card');
                        allStageCards.forEach(c => c.classList.remove('active'));
                        customLocationInput.classList.remove('active');
                        card.classList.add('active');

                        // Clear custom location input
                        customLocationInput.value = '';
                        currentCustomLocation = '';
                        submitCustomLocationBtn.disabled = true;

                        // Update timestamp
                        lastUpdatedSpan.textContent = 'Just now';

                        showModal('Success!', 'Location updated successfully! Your photobombers will be notified. 🎉');

                    } catch (err) {
                        console.error('Update error:', err);
                        showModal('Error', `Failed to update location: ${err.message}. Please try again.`);
                    } finally {
                        card.querySelector('p').textContent = originalText;
                    }
                });
            });
        }

        // Modal display function
        function showModal(title, message, buttonText = 'Close') {
            const existingModal = document.querySelector('.modal');
            if (existingModal) document.body.removeChild(existingModal);

            const modal = document.createElement('div');
            modal.className = 'modal';

            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content';

            const titleEl = document.createElement('h2');
            titleEl.className = 'text-xl font-bold mb-3 text-white glow';
            titleEl.textContent = title;

            const messageEl = document.createElement('p');
            messageEl.className = 'mb-4 text-white';
            messageEl.textContent = message;

            const button = document.createElement('button');
            button.className = 'gradient-animate text-white font-bold py-2 px-4 rounded-lg';
            button.textContent = buttonText;
            button.addEventListener('click', () => {
                document.body.removeChild(modal);
            });

            modalContent.appendChild(titleEl);
            modalContent.appendChild(messageEl);
            modalContent.appendChild(button);
            modal.appendChild(modalContent);
            document.body.appendChild(modal);
        }

        // Check authentication on page load
        checkAuth();
    });
</script>
</body>
</html>
